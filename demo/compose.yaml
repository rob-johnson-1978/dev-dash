name: my-dev-dash

networks:
  my-dev-dash-network:
    driver: bridge

services:  
  my-dev-dash-postgres:
    container_name: my-dev-dash-postgres
    image: postgres:17.7
    command: -c 'max_connections=512'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Secret@Postgres
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 30s
      retries: 3 
    networks:
      - my-dev-dash-network
    ports:
      - 5432:5432/tcp